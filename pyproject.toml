[project]
name = "bvhproject"
version = "0.1.0"
description = "GPU-accelerated LBVH construction — CME 213 project"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.9",
    "nbconvert>=7.17.1",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bvhproject"]

# cs248a-renderer is available here but requires open3d which needs glibc >= 2.31.
# This cluster has glibc 2.28 (RHEL 8).  The oracle and bridge are self-contained.
# Uncomment when running on a newer OS:
# [tool.uv.sources]
# cs248a-renderer = { path = "../asst3", editable = true }

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
